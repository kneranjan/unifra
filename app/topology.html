<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Unifra — Network Topology</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    :root {
      --green: #1ce783;
      --bg: #0a0f12;
      --bar-bg: #111318;
      --card-bg: #16181d;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: #eee;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top Bar ── */
    #bar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 20px;
      background: var(--bar-bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #bar .logo-link {
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.03em;
      text-decoration: none;
      color: #fff;
    }

    #bar .logo-link span { color: var(--green); }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
      margin-left: 8px;
    }

    .legend span { display: flex; align-items: center; gap: 5px; }

    /* ── Legend icons — pixel-matched to vis-network TYPE_STYLE below ── */
    .dot-icon {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      border: 2px solid transparent;
    }

    .diamond-icon {
      width: 10px; height: 10px;
      display: inline-block;
      flex-shrink: 0;
      background: #2196f322;
      border: 2px solid #2196f3;
      transform: rotate(45deg);
      margin: 0 2px;
    }

    .square-icon {
      width: 11px; height: 11px;
      display: inline-block;
      flex-shrink: 0;
      background: #ff980022;
      border: 2px solid #ff9800;
    }

    .box-icon {
      width: 16px; height: 11px;
      display: inline-block;
      flex-shrink: 0;
      background: #00bcd422;
      border: 2px solid #00bcd4;
      border-radius: 2px;
    }

    .status-ring {
      width: 12px; height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      background: #2a1010;
      border: 2px solid #f44336;
    }

    .edge-solid {
      width: 22px; height: 0;
      border-top: 2px solid #44475a;
      display: inline-block;
    }

    .edge-dashed {
      width: 22px; height: 0;
      border-top: 2px dashed #00bcd4;
      display: inline-block;
    }

    .legend-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .legend-divider {
      width: 1px;
      height: 16px;
      background: var(--border);
    }

    .legend-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #666;
      font-weight: 700;
    }

    #bar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #updated {
      font-size: 12px;
      color: #666;
    }

    #demo-badge {
      display: none;
      background: rgba(28,231,131,0.12);
      color: var(--green);
      border: 1px solid rgba(28,231,131,0.3);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 10px;
    }

    .btn-back {
      background: #1c1f27;
      color: #eee;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-scan {
      background: var(--green);
      color: #052;
      border: 0;
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-scan:hover { background: #12c46d; }
    .btn-scan.is-active { background: #193d2b; color: var(--green); border: 1px solid rgba(28,231,131,0.45); }
    .btn-scan:disabled { cursor: wait; opacity: 0.7; }
    .btn-reset { background: #30191c; color: #fca5a5; border: 1px solid rgba(248,113,113,0.42); border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-reset:hover { background: #452024; color: #fff; }
    .btn-reset:disabled { cursor: wait; opacity: 0.7; }

    /* ── Main Layout ── */
    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    #graph {
      flex: 1;
      height: 100%;
    }

    /* ── Details Panel ── */
    #details {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      width: 300px;
      max-height: calc(100% - 24px);
      overflow-y: auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      font-size: 14px;
      z-index: 10;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    #details h3 {
      margin: 0 0 12px;
      font-size: 16px;
      color: var(--green);
    }

    #details table { width: 100%; border-collapse: collapse; }
    #details td { padding: 4px 0; vertical-align: top; line-height: 1.4; }
    #details td:first-child { color: #666; width: 90px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    #details .close-btn {
      float: right;
      cursor: pointer;
      color: #555;
      font-size: 18px;
      line-height: 1;
    }
    #details .close-btn:hover { color: #fff; }
    #details .ports { margin: 8px 0 0; padding-left: 18px; color: #b7b7bf; font-size: 13px; line-height: 1.7; }
    .rename-control { display: flex; gap: 7px; margin: 0 0 14px; }
    .rename-control input { min-width: 0; flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 7px; background: #0d0f14; color: #eee; font: inherit; }
    .rename-control button { border: 0; border-radius: 7px; padding: 8px 10px; background: var(--green); color: #052; cursor: pointer; font-weight: 700; }
    .rename-control .rename-error { color: #f87171; font-size: 12px; }

    .status-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-up { background: rgba(28,231,131,0.15); color: var(--green); }
    .status-down { background: rgba(248,113,113,0.15); color: #f87171; }

    /* ── Empty / loading state ── */
    #empty-state {
      display: none;
      position: absolute;
      inset: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: #555;
      pointer-events: none;
    }
    #empty-state svg { opacity: 0.3; }
    #empty-state p { font-size: 14px; }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div id="bar">
    <a class="logo-link" href="/"><span>uni</span>fra</a>
    <div class="legend">
      <div class="legend-group">
        <span class="legend-label">Device</span>
        <span title="Diamond node, blue border (#2196f3)"><span class="diamond-icon"></span> Router</span>
        <span title="Square node, orange border (#ff9800)"><span class="square-icon"></span> Server</span>
        <span title="Circle node, green border (#4caf50)"><span class="dot-icon" style="border-color:#4caf50; background:#4caf5022"></span> PC</span>
        <span title="Circle node, purple border (#9c27b0)"><span class="dot-icon" style="border-color:#9c27b0; background:#9c27b022"></span> Phone</span>
        <span title="Rectangle/box node, cyan border (#00bcd4)"><span class="box-icon"></span> Container</span>
        <span title="Circle node, grey border (#888)"><span class="dot-icon" style="border-color:#888; background:#888222"></span> Unknown</span>
      </div>
      <div class="legend-divider"></div>
      <div class="legend-group">
        <span class="legend-label">Status</span>
        <span title="Any shape with red border = offline/down"><span class="status-ring"></span> Offline</span>
      </div>
      <div class="legend-divider"></div>
      <div class="legend-group">
        <span class="legend-label">Link</span>
        <span title="Solid grey edge = network link"><span class="edge-solid"></span> Network</span>
        <span title="Dashed cyan edge = container → host link"><span class="edge-dashed"></span> Container</span>
      </div>
    </div>
    <div id="bar-right">
      <span id="demo-badge">Sample data</span>
      <span id="updated"></span>
      <button id="scan-toggle" class="btn-scan" type="button" aria-pressed="false">Start 30s scan</button>
      <button id="reset-scan" class="btn-reset" type="button">Reset &amp; scan</button>
      <a class="btn-back" href="/">← Back to Dashboard</a>
    </div>
  </div>

  <!-- GRAPH + DETAILS -->
  <div id="main">
    <div id="graph"></div>

    <div id="details"></div>
  </div>

  <script>
    // ── Single source of truth for node rendering.
    // ── MUST stay in sync with the legend in #bar above:
    // ── router=diamond/blue, server=square/orange, pc=dot/green,
    // ── phone=dot/purple, container=box/cyan, unknown=dot/grey.
    // ── status "down" keeps the same shape but swaps border to red (#f44336).
    const TYPE_STYLE = {
      router:    { shape: "diamond", color: "#2196f3" },
      server:    { shape: "square",  color: "#ff9800" },
      pc:        { shape: "dot",     color: "#4caf50" },
      phone:     { shape: "dot",     color: "#9c27b0" },
      unknown:   { shape: "dot",     color: "#888888" },
      container: { shape: "box",     color: "#00bcd4" },
    };
    const DOWN_COLOR = "#f44336";

    // A useful, clearly labelled preview keeps the topology page informative
    // before the first discovery scan has populated the database.
    const DEMO_NODES = [
      { id: "demo-gateway", label: "Gateway", device_type: "router", status: "up" },
      { id: "demo-web", label: "Web Server", device_type: "server", status: "up" },
      { id: "demo-db", label: "Database", device_type: "server", status: "up" },
      { id: "demo-laptop", label: "Engineering PC", device_type: "pc", status: "up" },
      { id: "demo-phone", label: "Mobile Device", device_type: "phone", status: "up" },
      { id: "demo-offline", label: "Offline Host", device_type: "unknown", status: "down" },
      { id: "container-demo-nginx", label: "nginx", device_type: "container", status: "up" },
      { id: "container-demo-redis", label: "redis", device_type: "container", status: "up" },
    ];
    const DEMO_EDGES = [
      { from: "demo-gateway", to: "demo-web", type: "network" },
      { from: "demo-gateway", to: "demo-db", type: "network" },
      { from: "demo-gateway", to: "demo-laptop", type: "network" },
      { from: "demo-gateway", to: "demo-phone", type: "network" },
      { from: "demo-gateway", to: "demo-offline", type: "network" },
      { from: "container-demo-nginx", to: "demo-web", type: "container" },
      { from: "container-demo-redis", to: "demo-db", type: "container" },
    ];

    // ── Build vis-network ──
    const nodesDS = new vis.DataSet();
    const edgesDS = new vis.DataSet();

    const network = new vis.Network(
      document.getElementById("graph"),
      { nodes: nodesDS, edges: edgesDS },
      {
        physics: {
          enabled: true,
          solver: "forceAtlas2Based",
          forceAtlas2Based: { gravitationalConstant: -60, springLength: 140 },
          stabilization: { iterations: 200 },
        },
        nodes: {
          borderWidth: 2,
          borderWidthSelected: 3,
          font: { color: "#eee", size: 13 },
        },
        edges: {
          smooth: { type: "continuous" },
          width: 1.5,
        },
        interaction: { hover: true, tooltipDelay: 200 },
      }
    );

    // ── Helpers ──
    function esc(v) {
      const d = document.createElement("div");
      d.textContent = (v === null || v === undefined || v === "") ? "—" : String(v);
      return d.innerHTML;
    }

    function row(label, value) {
      return `<tr><td>${label}</td><td>${esc(value)}</td></tr>`;
    }

    function statusBadge(s) {
      const cls = s === "up" ? "status-up" : "status-down";
      return `<span class="status-badge ${cls}">${esc(s || "unknown")}</span>`;
    }

    function showDetails(html) {
      const panel = document.getElementById("details");
      panel.innerHTML = `<span class="close-btn" onclick="hideDetails()">✕</span>` + html;
      panel.style.display = "block";
    }

    function hideDetails() {
      document.getElementById("details").style.display = "none";
    }

    async function saveHostName(ip) {
      const input = document.getElementById("host-name-input");
      const error = document.getElementById("rename-error");
      const button = document.getElementById("rename-save");
      const name = input.value.trim();
      if (!name) {
        error.textContent = "Enter a name first.";
        return;
      }
      button.disabled = true;
      error.textContent = "";
      try {
        const res = await fetch(`/hosts/${encodeURIComponent(ip)}/name`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name }),
        });
        if (!res.ok) throw new Error("Could not save the name");
        await refresh();
        await showHost(ip);
      } catch (_) {
        error.textContent = "Could not save the name. Try again.";
      } finally {
        button.disabled = false;
      }
    }

    // ── Click handlers (live API only — no demo fallback) ──
    async function showHost(id) {
      const node = nodesDS.get(id);
      if (String(id).startsWith("demo-")) {
        showDetails(
          `<h3>${esc(node.label)}</h3>` +
          `<table>` +
          row("Type", node.device_type) +
          `<tr><td>Status</td><td>${statusBadge(node.status)}</td></tr>` +
          row("Source", "Sample topology") +
          `</table>` +
          `<p style="color:#9a9aaf;font-size:13px;margin-top:12px">This is preview data. Run a discovery scan to view your network.</p>`
        );
        return;
      }
      try {
        const res = await fetch(`/hosts/${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error("not found");
        const h = await res.json();
        const ports = (h.open_ports || []).map(p =>
          `<li>${esc(p.port)}/${esc(p.protocol)} — ${esc(p.service)} ${esc(p.product)}</li>`
        ).join("");
        showDetails(
          `<h3>${esc(h.hostname || h.ip)}</h3>` +
          `<div class="rename-control"><input id="host-name-input" maxlength="100" value="${esc(h.hostname || "")}" placeholder="Name this device" aria-label="Device name"><button id="rename-save" type="button" onclick="saveHostName('${esc(id)}')">Save</button></div>` +
          `<p id="rename-error" class="rename-error" role="alert"></p>` +
          `<table>` +
          row("IP", h.ip) +
          row("Type", node ? node.device_type : "unknown") +
          `<tr><td>Status</td><td>${statusBadge(h.status)}</td></tr>` +
          row("MAC", h.mac) +
          row("Vendor", h.vendor) +
          row("OS", h.os_guess) +
          row("Last Seen", h.last_seen) +
          `</table>` +
          `<p style="margin:12px 0 4px;color:#666;font-size:12px;text-transform:uppercase;letter-spacing:0.05em">Open Ports</p>` +
          (ports ? `<ul class="ports">${ports}</ul>` : `<p style="color:#555;font-size:13px">None found</p>`)
        );
      } catch (_) {
        showDetails(
          `<h3>${esc(node ? node.label : id)}</h3>` +
          `<table>` +
          row("IP", id) +
          row("Type", node ? node.device_type : "unknown") +
          `<tr><td>Status</td><td>${statusBadge(node ? node.status : "unknown")}</td></tr>` +
          row("Note", "Run a network scan to see live data") +
          `</table>`
        );
      }
    }

    async function showContainer(id) {
      const containerId = id.replace("container-", "");
      if (containerId.startsWith("demo-")) {
        const node = nodesDS.get(id);
        showDetails(
          `<h3>${esc(node.label)}</h3>` +
          `<table>` + row("Type", "container") + row("Source", "Sample topology") + `</table>` +
          `<p style="color:#9a9aaf;font-size:13px;margin-top:12px">This is preview data. Run a discovery scan to view live containers.</p>`
        );
        return;
      }
      try {
        const res = await fetch("/containers/");
        const list = await res.json();
        const c = list.find(x => x.container_id === containerId);
        if (!c) throw new Error("not found");
        showDetails(
          `<h3>${esc(c.name)}</h3>` +
          `<table>` +
          row("Image", c.image) +
          `<tr><td>State</td><td>${statusBadge(c.state === "running" ? "up" : "down")} ${esc(c.state)}</td></tr>` +
          row("Host", c.host_ip) +
          row("Last Seen", c.last_seen) +
          `</table>`
        );
      } catch (_) {
        showDetails(
          `<h3>Container: ${esc(containerId)}</h3>` +
          `<p style="color:#555;font-size:13px;margin-top:8px">Start Docker containers and run a scan to see live data.</p>`
        );
      }
    }

    network.on("click", params => {
      if (params.nodes.length === 0) { hideDetails(); return; }
      const id = params.nodes[0];
      if (String(id).startsWith("container-")) {
        showContainer(id);
      } else {
        showHost(id);
      }
    });

    // ── Build node/edge vis objects (mirrors legend) ──
    function buildVisNodes(rawNodes) {
      return rawNodes.map(n => {
        const deviceType = TYPE_STYLE[n.device_type] ? n.device_type : "unknown";
        const style = TYPE_STYLE[deviceType];
        const isDown = n.status === "down";
        return {
          id: n.id,
          label: n.label,
          title: (n.title || n.label) + `\nType: ${deviceType} · Status: ${n.status || "unknown"}`,
          device_type: deviceType,
          status: n.status,
          shape: style.shape,
          color: {
            background: isDown ? "#2a1010" : style.color + "22",
            border: isDown ? DOWN_COLOR : style.color,
            highlight: { border: "#ffffff", background: style.color + "44" },
            hover: { border: "#ffffff", background: style.color + "44" },
          },
          font: { color: "#eee" },
          size: deviceType === "container" ? 22 : 20,
        };
      });
    }

    function buildVisEdges(rawEdges) {
      return rawEdges.map(e => ({
        id: `${e.from}→${e.to}`,
        from: e.from,
        to: e.to,
        color: { color: e.type === "container" ? "#00bcd488" : "#44475a" },
        dashes: e.type === "container",
      }));
    }

    // ── Refresh from API ──
    function showTopologyNotice(message) {
      const badge = document.getElementById("demo-badge");
      badge.title = message;
      badge.style.display = "inline-block";
    }

    function hidePreviewIndicators() {
      document.getElementById("demo-badge").style.display = "none";
    }

    function renderTopology(rawNodes, rawEdges, offsetX = 0) {
      const nodes = buildVisNodes(rawNodes);
      const edges = buildVisEdges(rawEdges);
      nodesDS.clear();
      edgesDS.clear();
      nodesDS.add(nodes);
      edgesDS.add(edges);
      network.fit({
        animation: { duration: 350, easingFunction: "easeInOutQuad" },
        offset: { x: offsetX, y: 0 },
      });
    }

    function renderPreview(message) {
      // Keep preview nodes clear of the explanatory card on the lower right.
      renderTopology(DEMO_NODES, DEMO_EDGES, -180);
      showTopologyNotice(message);
    }

    let scanEnabled = false;

    function updateScanButton(enabled, intervalSeconds = 30, resetting = false) {
      scanEnabled = enabled;
      const button = document.getElementById("scan-toggle");
      button.classList.toggle("is-active", enabled);
      button.setAttribute("aria-pressed", String(enabled));
      button.disabled = resetting;
      button.textContent = resetting
        ? "Reset in progress…"
        : enabled ? `● Scan on (${intervalSeconds}s)` : `Start ${intervalSeconds}s scan`;
    }

    async function loadScanStatus() {
      try {
        const res = await fetch("/discovery/status");
        if (!res.ok) throw new Error("status unavailable");
        const status = await res.json();
        updateScanButton(status.enabled, status.interval_seconds, status.resetting);
      } catch (_) {
        document.getElementById("scan-toggle").textContent = "Scan unavailable";
      }
    }

    async function toggleScan() {
      const button = document.getElementById("scan-toggle");
      button.disabled = true;
      try {
        const res = await fetch("/discovery/toggle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ enabled: !scanEnabled }),
        });
        if (!res.ok) throw new Error("toggle failed");
        const status = await res.json();
        updateScanButton(status.enabled, status.interval_seconds);
      } finally {
        button.disabled = false;
      }
    }

    async function resetAndScan() {
      const confirmed = window.confirm(
        "Reset the topology? This removes all saved hosts, links, containers, and custom device names, then starts a fresh scan."
      );
      if (!confirmed) return;

      const button = document.getElementById("reset-scan");
      const scanButton = document.getElementById("scan-toggle");
      button.disabled = true;
      scanButton.disabled = true;
      button.textContent = "Resetting…";
      try {
        const res = await fetch("/discovery/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ start_scan: true }),
        });
        if (!res.ok) throw new Error("reset failed");
        const result = await res.json();
        updateScanButton(result.scan_enabled, result.interval_seconds, result.resetting);
        document.getElementById("updated").textContent = "Reset queued — preparing fresh scan…";
        await refresh();
      } catch (_) {
        document.getElementById("updated").textContent = "Reset failed — try again";
      } finally {
        button.disabled = false;
        button.textContent = "Reset & scan";
      }
    }

    document.getElementById("scan-toggle").addEventListener("click", toggleScan);
    document.getElementById("reset-scan").addEventListener("click", resetAndScan);

    async function refresh() {
      try {
        const res = await fetch("/topology/");
        if (!res.ok) throw new Error("API error");
        const data = await res.json();

        if (!data.nodes || data.nodes.length === 0) {
          renderPreview("No discovery data is available yet. This preview will be replaced automatically after your first scan.");
          document.getElementById("updated").textContent = "Preview · waiting for live data";
          return;
        }

        hidePreviewIndicators();
        renderTopology(data.nodes, data.edges || []);

        document.getElementById("updated").textContent = "Live · updated " + new Date().toLocaleTimeString();
      } catch (err) {
        document.getElementById("updated").textContent = "Preview · server unavailable";
        renderPreview("The live topology API is temporarily unavailable. Check the server, then try again.");
      }
    }

    function retryRefresh() {
      document.getElementById("updated").textContent = "Checking…";
      refresh();
    }

    // Start
    refresh();
    loadScanStatus();
    setInterval(refresh, 30000);
    setInterval(loadScanStatus, 30000);
  </script>
</body>
</html>
